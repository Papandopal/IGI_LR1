{% extends 'parking/base.html' %}
{% load static %}
{% block title %}Мы тут{% endblock %}

{% block content %}
<div class="container py-5">
    <h1>Мы тут</h1>
    <div style="max-width: 1200px; margin: 0 auto; padding: 20px; text-align: center;">
        <img src="{% static 'images/kapibara.jpg' %}"
            srcset="{% static 'images/kapibara.jpg' %} 1x,
                    {% static 'images/kapibara@2x.jpg' %} 2x"
            sizes="(max-width: 600px) 100vw, 50vw"
            alt="Наша парковка">
    </div>
    <!-- Iframe -->
    <section class="mb-5">
        <h3>Google Maps</h3>
        <div class="ratio ratio-16x9">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d100000!2d{{ random_longitude }}!3d{{ random_latitude }}!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2z{{ random_latitude|floatformat:6 }}!5e0!3m2!1sen!2sus!4v1234567890!5m2!1sen!2sus"
                    width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                    title="Случайное место на Google Maps">
            </iframe>
        </div>
        <p class="mt-2 text-muted">Координаты: {{ random_latitude|floatformat:4 }}°, {{ random_longitude|floatformat:4 }}°</p>
    </section>
</div>


{% endblock %}
